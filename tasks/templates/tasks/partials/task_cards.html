{% for task in tasks %}
<div class="glass glass-hover p-3 mb-3 task-card" data-task-id="{{ task.id }}" style="cursor:grab;border-radius:var(--r-md);">
    <div class="d-flex justify-content-between align-items-start mb-1">
        <h6 class="fw-700 mb-0" style="font-size:0.95rem;">{{ task.title }}</h6>
        <div class="d-flex gap-1">
            <button type="button" class="icon-btn edit-task" data-task-id="{{ task.id }}" title="Редактировать" style="width:28px;height:28px;"><svg class="ic ic-sm"><use href="#i-edit"></use></svg></button>
            <button type="button" class="icon-btn delete-task" data-task-id="{{ task.id }}" title="Удалить" style="width:28px;height:28px;"><svg class="ic ic-sm"><use href="#i-trash"></use></svg></button>
        </div>
    </div>
    <p class="muted mb-3" style="font-size:0.82rem;font-weight:500;">{{ task.description|truncatechars:60 }}</p>
    <div class="d-flex justify-content-between align-items-center">
        <div class="d-flex align-items-center gap-2">
            <span class="d-inline-flex align-items-center gap-1 {% if task.is_overdue %}text-overdue{% else %}faint{% endif %}" style="font-weight:600;font-size:0.78rem;"{% if task.is_overdue %} title="Просрочена"{% endif %}><svg class="ic ic-sm" style="width:14px;height:14px;"><use href="#i-calendar"></use></svg>{{ task.deadline|date:"d.m.Y"|default:"—" }}</span>
            {% if task.attachment_count %}<span class="attach-badge"><svg class="ic ic-sm" style="width:13px;height:13px;"><use href="#i-clip"></use></svg>{{ task.attachment_count }}</span>{% endif %}
        </div>
        <span class="prio {% if task.priority.name == 'Высокий' %}high{% elif task.priority.name == 'Средний' %}mid{% else %}low{% endif %}"><span class="dot"></span>{{ task.priority.name }}</span>
    </div>
</div>
{% endfor %}
